
name: Actualiser les promotions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Importer les codes promo
        continue-on-error: true
        run: python scripts/import_coupons.py

      - name: Importer et nettoyer les promotions
        run: |
          HOUR=$(TZ=Europe/Paris date +%H)

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$HOUR" = "07" ] || [ "$HOUR" = "12" ] || [ "$HOUR" = "18" ]; then
            python scripts/import_feed.py
            python scripts/refresh_deals.py
          else
            echo "Pas d'actualisation prévue à cette heure."
          fi

      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deals.json coupons.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualisation des promotions et codes promo"
            git push
          fi
