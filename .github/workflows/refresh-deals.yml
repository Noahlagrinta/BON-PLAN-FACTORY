
name: Actualiser les promotions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Importer les codes promo
        continue-on-error: true
        run: python scripts/import_coupons.py

      - name: Importer les pépites
        run: python scripts/import_feed.py

      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json coupons.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualisation des promotions"
            git push
          fi
